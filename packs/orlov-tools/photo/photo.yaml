# Направление: фото и видеосъёмка на заказ.
#
# Фотограф или видеограф ведёт дела о съёмках: разовая съёмка, проект
# под ключ, аренда студии, печать альбома. Заказчик видит те же этапы и
# принимает работу по акту. Пак отвечает по тому, что принесли в дело:
# заявка, смета, договор — и прямо говорит, чего не делает: не бронирует
# студию, не пересылает файлы съёмки, не называет цену от себя.
#
# ЧУВСТВИТЕЛЬНОСТЬ. В деле есть переписка с заказчиками, планы чужих
# праздников и деньги, поэтому манифест пака просит normal, pii и financial.

id: photo
title: Фото и видеосъёмка
version: 1
description: >
  Направление для тех, кто снимает на заказ: фотографы и видеографы, разовые
  съёмки и проекты. Дело о съёмке идёт от заявки и брифа через смету и договор
  к съёмке, обработке, показу и передаче материала с оплатой по акту; рядом —
  аренда студии и печать альбома как отдельные короткие сделки. Исполнитель —
  фотограф, видеограф или студия, заказчик — человек или бренд; арендуя студию
  и передавая ретушь, фотограф сам становится заказчиком. Организацию самих
  событий и поездок ведут соседние направления — здесь только съёмка.

party_roles:
  - {role: photographer, title: Фотограф, likely_user: true, reciprocal: client}
  - {role: videographer, title: Видеограф, likely_user: true, reciprocal: client}
  - {role: client, title: Заказчик, likely_user: true, reciprocal: photographer}
  - {role: studio, title: Студия или локация, likely_user: true, reciprocal: photographer}
  - {role: retoucher, title: Ретушёр, likely_user: true, reciprocal: photographer}

entity_types:
  - type: shoot
    title: Съёмка
    plural: Съёмки
    sensitivity: normal
    fields:
      - {key: kind, title: Вид съёмки, kind: enum, required: true,
         options: [love story, свадьба, репортаж, семейная, предметная, интерьерная, коммерческая]}
      - {key: date, title: Дата, kind: date, required: true}
      - {key: hours, title: Часов съёмки, kind: number, unit: ч}
      - {key: place, title: Место, kind: text}
      - {key: budget, title: Бюджет, kind: money, unit: руб.}
      - {key: retouch, title: Кадров в ретуши, kind: number}

  - type: location
    title: Локация
    plural: Локации
    sensitivity: normal
    fields:
      - {key: title, title: Название, kind: text, required: true}
      - {key: address, title: Адрес, kind: text}
      - {key: rate, title: Аренда часа, kind: money, unit: руб.}
      - {key: permit, title: Нужно разрешение на съёмку, kind: bool}

  - type: footage
    title: Материал
    plural: Материалы
    sensitivity: normal
    fields:
      - {key: kind, title: Что это, kind: enum, required: true,
         options: [исходники, ретушь, альбом, фильм]}
      - {key: volume, title: Объём, kind: number}
      - {key: due, title: Срок готовности, kind: date}
      - {key: handed, title: Передан заказчику, kind: bool}

platform_abilities:
  - key: timing_sheet
    title: Собрать тайминг съёмочного дня
    mode: own_corpus
    note: >
      Тайминг собирается в самом деле: время сборов, переезды, блоки съёмки
      и резерв. Его видят все участники дела, правки входят в журнал.

  - key: shot_list
    title: Составить список кадров
    mode: own_corpus
    note: >
      Шот-лист по кадрам, которые назвали на брифе: обязательные, желаемые
      и запасные. Служит чек-листом на съёмке и при приёмке материала.

  - key: studio_booking
    title: Забронировать студию или локацию самому
    mode: not_built
    note: >
      Этого пак не делает: бронь и оплату делает человек в своём браузере
      или по телефону. Пак напоминает дату, аренду и что уточнить у студии:
      вспышку, фон, разрешение на съёмку, время загрузки.

  - key: file_delivery
    title: Принять и переслать файлы съёмки
    mode: not_built
    note: >
      Исходники и ретушь ходят мимо площадки: облако, носитель, передача
      из рук в руки. Пак фиксирует в деле, что, сколько и к какому сроку
      нужно передать, и напоминает про акт приёма-передачи.

deal_kinds:
  - kind: single
    title: Разовая съёмка
    stages: [заявка, бриф, смета и договор, съёмка, обработка, показ, передача и оплата]
  - kind: project
    title: Съёмка проекта
    stages: [заявка, концепция, смета, препродакшн, съёмочные дни, постпродакшн, приёмка, оплата]
  - kind: studio_rent
    title: Аренда студии
    stages: [запрос, бронь, оплата, съёмка, возврат]
  - kind: album_print
    title: Печать альбома
    stages: [заявка, макет, согласование, печать, приёмка и оплата]

document_kinds:
  - договор на съёмку
  - смета съёмки
  - тайминг съёмочного дня
  - техническое задание на съёмку
  - акт приёма-передачи материала
  - лицензия на использование кадров
  - согласие на съёмку и обработку изображений

case_templates:
  - id: photo.general
    version: 1
    title: Съёмка на заказ
    kind: task
    intake:
      - {key: kind, title: Вид съёмки, kind: enum, required: true,
         options: [love story, свадьба, репортаж, семейная, предметная, интерьерная, коммерческая]}
      - {key: date, title: Дата, kind: date}
      - {key: place, title: Место, kind: text}
      - {key: wish, title: Что важно получить, kind: text}
    workflow:
      initial_state: intake
      states: [intake, shooting, editing, done]
      terminal_states: [done]
      transitions:
        - {source: intake, target: shooting}
        - {source: shooting, target: editing}
        - {source: editing, target: done}
    required_capabilities: [dialog, case_patch]
    approvals:
      human_from: 2
      always_require: [propose_decision]
    done_criteria:
      - Съёмка состоялась, материал передан заказчику и отмечен в деле.
      - Акт приёма-передачи материала предложен и подписан сторонами.
      - "Прямо сказано, чего пак не делает: студию не бронирует, файлы не пересылает."

  - id: photo.studio
    version: 1
    title: Аренда студии для съёмки
    kind: task
    intake:
      - {key: date, title: Дата, kind: date, required: true}
      - {key: hours, title: Сколько часов, kind: number}
      - {key: wish, title: Что снимаем, kind: text}
    workflow:
      initial_state: intake
      states: [intake, booked, done]
      terminal_states: [done]
      transitions:
        - {source: intake, target: booked}
        - {source: booked, target: done}
    required_capabilities: [dialog, case_patch]
    approvals:
      human_from: 2
      always_require: []
    done_criteria:
      - Студия выбрана человеком, дата и часы отмечены в деле.
      - "Названо, что уточнить у студии: фон, свет, разрешение, время загрузки."
      - После съёмки зафиксирован возврат студии без замечаний или с ними.

agents:
  - id: shooter
    title: Помощник по съёмке
    model: mimo-v2.5
    label: photo_shooter
    side: need_help
    min_assurance: 2
    match_priority: 50
    capabilities: [dialog, case_patch]
    sensitivity_clearance: [normal, pii, financial]
    purpose: >
      Ведёшь дело о съёмке вместе с фотографом, видеографом или заказчиком:
      уточняешь вид съёмки, дату, место, часы и что важно получить; предлагаешь
      следующий шаг по сделке — бриф, смета и договор до съёмки, тайминг и
      список кадров к ней, показ и передача материала после. Напоминаешь, что
      нужно уточнить у студии при аренде, и что material передаётся по акту.
      Отвечаешь по тому, что принесли в дело: заявке, брифу, смете, договору.
      Не хватает данных — говоришь, каких именно, а не придумываешь их.
    never:
      - "не называешь цену от себя: смету считает и согласовывает фотограф"
      - "не бронируешь студию и не платишь: бронь и оплата остаются за человеком"
      - не пересылаешь файлы съёмки и не обещаешь доставку исходников
      - не оцениваешь художественное качество чужих кадров и не правишь их
      - не обещаешь результат, который зависит от погоды, людей и третьих лиц
      - "не заводишь дело за человека: он подтверждает каждый шаг сам"

recipes:
  - key: kak_idet_delo_o_semke
    title: 'Как идёт дело о съёмке: от заявки до акта'
    kind: инструкция
    about_abilities: [timing_sheet, shot_list, studio_booking]
    body: |
          Дело о съёмке заводит сам человек — фотограф или заказчик, одним
          нажатием. Дальше стороны идут по этапам сделки: заявка, бриф, смета
          и договор, съёмка, обработка, показ, передача материала и оплата.
          Смету и договор согласуют до съёмки: правка условий после съёмки —
          обычный источник споров.

          К съёмке помощник собирает в деле тайминг дня и список кадров:
          обязательные, желаемые, запасные. При аренде студии бронь и оплату
          делает человек сам — помощник лишь напоминает дату, часы и список
          вопросов к студии: фон, свет, вспышка, разрешение на съёмку, время
          загрузки и возврата.

          После съёмки материал передаётся мимо площадки — облаком или
          носителем, — а в деле фиксируются что, сколько и когда передано.
          Приёмка оформляется актом приёма-передачи материала, и это последний
          шаг перед оплатой.
