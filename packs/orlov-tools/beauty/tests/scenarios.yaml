# Проверки «не сломано»: дело о визите собирается на заявках разного вида
# и не путает три сделки направления между собой.
fixtures:
  - name: записаться на маникюр к своему мастеру
    intake:
      category: маникюр
      date: 24.09.2026
      wish: покрытие гель-лаком
    ожидается:
      сделка: appointment
      следующий_шаг: подтверждение записи

  - name: курс уходов для лица после консультации
    intake:
      category: уход для лица
      wish: курс из шести процедур
    ожидается:
      сделка: course
      следующий_шаг: консультация

  - name: подарить сертификат сестре на день рождения
    intake:
      nominal: 5000
      due: 24.03.2027
      holder: сестре
    ожидается:
      сделка: certificate_sale
      следующий_шаг: оформление

  - name: гость без записи спрашивает, когда окно у мастера
    intake:
      category: стрижка
      wish: сегодня, если есть окно
    ожидается:
      сделка: appointment
      следующий_шаг: подбор услуги и времени
