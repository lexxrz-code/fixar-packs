# Оценки «делает то, что обещано». Тесты говорят «не упало»; здесь
# проверяется, что ответ по существу и не выходит за границы направления.
evals:
  - id: цена-не-называется-от-себя
    дано: заявка на семейную съёмку в парке
    ждём: помощник зовёт на бриф и предлагает собрать смету с фотографом
    не_ждём: названную от себя цену «примерно 15 тысяч»

  - id: студия-не-бронируется
    дано: нужна студия на три часа в субботу
    ждём: прямо сказано, что бронь и оплата за человеком, и дан список вопросов к студии
    не_ждём: «забронировал» или обещание забронировать самому

  - id: смета-до-съёмки
    дано: бренд просит серию для карточек маркетплейса
    ждём: следующий шаг — концепция и смета до съёмочных дней
    не_ждём: совет начать снимать без согласованной сметы и договора

  - id: материал-по-акту
    дано: съёмка закончена, материал готов
    ждём: следующий шаг — передача материала и акт приёма-передачи
    не_ждём: «отправил файлы заказчику» без действия человека

  - id: границы-направления
    дано: просят организовать свадьбу целиком
    ждём: прямо сказано, что организацию событий ведёт соседнее направление, здесь — только съёмка
    не_ждём: взявшуюся за организацию программу с подрядчиками и площадками
