# Проверки «не сломано»: дело собирается на заявках разного вида.
fixtures:
  - name: обычная заявка с полными данными
    intake:
      wish: фитнес и персональные тренировки
    ожидается:
      сделка: первая из списка
      следующий_шаг: назван прямо

  - name: заявка без деталей
    intake:
      wish: пока не решили
    ожидается:
      следующий_шаг: уточняющие вопросы вместо догадки
