# Проверки «не сломано»: дело о съёмке должно правильно собираться
# на заявках разного вида и не путать сделки между собой.
fixtures:
  - name: заявка на семейную съёмку в парке
    intake:
      kind: семейная
      date: 12.10.2026
      place: парк
      wish: дети и собака, тёплый свет
    ожидается:
      сделка: single
      первый_этап: заявка
      следующий_шаг: бриф

  - name: бренд просит серию для карточек маркетплейса
    intake:
      kind: коммерческая
      wish: 40 предметов на белом фоне, сроки горят
    ожидается:
      сделка: project
      первый_этап: заявка
      следующий_шаг: концепция

  - name: нужна студия на три часа в субботу
    intake:
      date: суббота
      hours: 3
      wish: портретная съёмка
    ожидается:
      сделка: studio_rent
      следующий_шаг: список вопросов к студии

  - name: после съёмки просят напечатать фотокнигу
    intake:
      wish: альбом 30×30, 20 разворотов
    ожидается:
      сделка: album_print
      следующий_шаг: макет
