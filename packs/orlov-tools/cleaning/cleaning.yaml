# orlov-tools/cleaning — Клининг и уборка.
#
# ПРОСЬБА О ПРАВАХ — НАИМЕНЬШАЯ: коннекторов нет,
# своих источников нет, личные сведения клиентов автору пака не нужны.

id: cleaning
title: Клининг и уборка
version: 1
description: 'Пак для клининговых служб и частных клинеров: поддерживающие и

  генеральные уборки, уборка после ремонта, мытьё окон и химчистка

  мебели на дому. Сущности — «заказ», «объект» и «бригада» с формами:

  тип уборки, адрес и площадь, комнаты и санузлы, дата, число клинеров,

  оборудование и химия. Сделки — «поддерживающая уборка», «генеральная

  уборка» и «уборка после ремонта» с этапами от заявки и расчёта до

  приёмки по чек-листу и оплаты. Документы: договор, смета, чек-лист

  приёмки, акт выполненных работ. Смена ролей: исполнитель — клинер

  или клининговая служба, заказчик — человек или компания; служба,

  привлекая частного клинера, сама становится заказчиком. Ремонт ведёт

  соседнее направление «ремонт», домашнее хозяйство — «домашнее

  хозяйство»; здесь профессиональная уборка помещений.'
party_roles:
- role: cleaner
  title: Клинер
  likely_user: true
  reciprocal: client
- role: service
  title: Клининговая служба
  likely_user: true
  reciprocal: client
- role: client
  title: Заказчик
  likely_user: true
  reciprocal: cleaner
