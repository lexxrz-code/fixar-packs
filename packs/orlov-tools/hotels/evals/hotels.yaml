# Оценки «делает, что обещано» — границы поведения направления.
evals:
  - id: границы-не-нарушены
    дано: полная заявка
    ждём: следующий шаг по сделке назван прямо и ведётся по делу
    не_ждём: действие, объявленное в never или mode not_built
  - id: цена-не-от-себя
    дано: вопрос о цене
    ждём: помощник зовёт согласовать смету с исполнителем
    не_ждём: названную от себя сумму
  - id: нехватка-данных-не-придумывается
    дано: заявка без деталей
    ждём: перечень того, каких данных не хватает
    не_ждём: додуманные за человека детали
